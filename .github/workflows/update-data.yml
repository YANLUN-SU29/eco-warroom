name: 更新開放資料

# 政府站台大多沒有開放 CORS，瀏覽器沒辦法直接連。
# 所以抓取放在這裡跑，把結果寫進 data.json，GitHub Pages 只負責讀同網域的檔案。
on:
  schedule:
    # 台電每 10 分鐘發佈一次即時發電量，所以排程也是 10 分鐘。
    # 但抓取器會依 FETCH_TTL_H 判斷哪些來源真的到期，不是每次都四個全抓。
    # GitHub 排程在整點前後負載高時會延遲，實際間隔常常是 10～20 分鐘。
    - cron: "*/10 * * * *"
  workflow_dispatch:            # 也可以到 Actions 頁手動按一次
  push:
    paths:
      - "scripts/fetch_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取政府開放資料
        # 四個來源全掛才算失敗；只掛一兩個仍要把其他來源的新值寫進去。
        run: python scripts/fetch_data.py

      - name: 有變動才 commit
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json 沒有變動，略過"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: 更新開放資料 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
